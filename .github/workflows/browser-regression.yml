name: Browser Regression

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - ".github/workflows/browser-regression.yml"
      - "Makefile"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - "docker-compose.browser.yml"
      - "docker/browser/**"
      - "tests/browser/**"
      - "config/settings/base.py"
      - "config/settings/browser_test.py"
      - "apps/news/access.py"
      - "apps/news/blocks.py"
      - "apps/news/models.py"
      - "apps/news/seo_metadata.py"
      - "apps/news/forms.py"
      - "apps/news/panels.py"
      - "apps/news/taxonomy.py"
      - "apps/news/taxonomy_forms.py"
      - "apps/news/widgets.py"
      - "apps/news/smart_paste.py"
      - "apps/news/smart_paste_contracts.py"
      - "apps/news/smart_paste_views.py"
      - "apps/news/views.py"
      - "apps/news/wagtail_hooks.py"
      - "apps/news/wagtail_hook_handlers.py"
      - "apps/news/seo/**"
      - "apps/news/management/commands/setup_browser_test.py"
      - "apps/news/migrations/**"
      - "apps/news/templates/news/admin/seo_assistant_panel.html"
      - "apps/news/templates/news/admin/page_seo_context_panel.html"
      - "apps/news/templates/news/admin/writing_mode_field_panel.html"
      - "apps/news/templates/news/widgets/taxonomy_tree.html"
      - "static/news/css/seo_assistant.css"
      - "static/news/css/taxonomy_tree.css"
      - "static/news/css/writing_mode.css"
      - "static/news/js/seo_assistant.js"
      - "static/news/js/smart_paste.js"
      - "static/news/js/taxonomy_tree.js"
      - "static/news/js/writing_mode.js"
      - "static/public/css/site.css"
      - "static/public/js/**"
      - "config/urls.py"
      - "templates/base.html"
      - "templates/news/news_page.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    name: Browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run isolated Chromium regression
        run: make browser-test
