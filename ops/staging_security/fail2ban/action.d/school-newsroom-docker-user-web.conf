[Definition]

# DOCKER-USER is evaluated before Docker accepts forwarded published-port
# traffic. Only inbound TCP traffic for HTTP/HTTPS enters this ban chain.
actionstart = <iptables> -w -N <f2b_chain> 2>/dev/null || true
              <iptables> -w -C <f2b_chain> -j RETURN >/dev/null 2>&1 || <iptables> -w -A <f2b_chain> -j RETURN
              <iptables> -w -C DOCKER-USER -p tcp -m multiport --dports 80,443 -j <f2b_chain> >/dev/null 2>&1 || <iptables> -w -I DOCKER-USER 1 -p tcp -m multiport --dports 80,443 -j <f2b_chain>
actionstop = <iptables> -w -D DOCKER-USER -p tcp -m multiport --dports 80,443 -j <f2b_chain> >/dev/null 2>&1 || true
             <iptables> -w -F <f2b_chain> >/dev/null 2>&1 || true
             <iptables> -w -X <f2b_chain> >/dev/null 2>&1 || true
actioncheck = <iptables> -w -C DOCKER-USER -p tcp -m multiport --dports 80,443 -j <f2b_chain>
actionban = <iptables> -w -I <f2b_chain> 1 -s <ip> -j DROP
actionunban = <iptables> -w -D <f2b_chain> -s <ip> -j DROP

[Init]

f2b_chain = f2b-sn-web
iptables = iptables

[Init?family=inet6]

iptables = ip6tables
