[Definition]

# Caddy's JSON encoder emits remote_ip before all requester-controlled fields.
# The status match is a JSON field, not text from the request URI or headers.
failregex = ^\{"level":"info",.*,"request":\{"remote_ip":"<ADDR>",.*\},.*"status":429(?:,|\})
ignoreregex =
datepattern = {NONE}
